[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "measurement-inspector"
version = "0.1.0"
description = "Local measurement analysis dashboard for eCAL HDF data"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "panel>=1.3",
  "holoviews>=1.18",
  "hvplot>=0.10",
  "typer>=0.12",
  "pydantic>=2.5",
  "eclipse-ecal>=6.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
measure-inspect = "measurement_inspector.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["measurement_inspector*"]
